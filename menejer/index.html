<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Футбол менежер — Мустафо</title>
  <style>
    body {
      font-family: Arial, sans-serif; margin: 0; padding: 0 10px 30px;
      background: linear-gradient(#0b3d1a, #145a2a); color: #fff;
    }
    header { text-align: center; padding: 16px 0 6px; }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 4px 0 0; color: #c8e6c9; }
    main { max-width: 900px; margin: 0 auto; }
    .karta { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
             border-radius: 16px; padding: 14px; margin: 12px 0; }
    .karta h2 { margin: 0 0 10px; font-size: 20px; }
    button { font-size: 15px; padding: 8px 14px; border-radius: 10px; cursor: pointer;
             border: 2px solid #ffd54f; background: #ffd54f; color: #3e2723; font-weight: bold; }
    button:disabled { opacity: .45; cursor: default; }
    button.oddiy { background: transparent; color: #ffd54f; }

    /* пул ва жамоа ҳолати */
    .holat { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .holat div { background: rgba(0,0,0,.25); border-radius: 12px; padding: 8px 14px; text-align: center; min-width: 110px; }
    .holat b { display: block; font-size: 22px; color: #ffd54f; }

    /* позиция тугмалари */
    .tablar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tablar button { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
    .tablar button.faol { background: #ffd54f; color: #3e2723; border-color: #ffd54f; }

    /* ўйинчи карточкалари */
    .royxat { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .oyinchi { background: linear-gradient(160deg, #fff8e1, #ffe082); color: #3e2723; border-radius: 12px;
               padding: 8px 10px; cursor: pointer; border: 3px solid transparent; transition: transform .15s; }
    .oyinchi:hover { transform: translateY(-3px); }
    .oyinchi.olingan { border-color: #00e676; background: linear-gradient(160deg, #e8f5e9, #a5d6a7); }
    .oyinchi .reyting { font-size: 24px; font-weight: 900; }
    .oyinchi .poz { font-size: 11px; font-weight: bold; background: #3e2723; color: #ffd54f; border-radius: 6px; padding: 1px 6px; }
    .oyinchi .ism { font-weight: bold; font-size: 14px; margin: 4px 0; min-height: 34px; }
    .oyinchi .narx { font-size: 13px; }

    /* майдон */
    .maydon { position: relative; height: 380px; border-radius: 14px; overflow: hidden;
              background: repeating-linear-gradient(0deg, #2e7d32 0 38px, #388e3c 38px 76px);
              border: 3px solid rgba(255,255,255,.7); }
    .maydon::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid rgba(255,255,255,.6); }
    .maydon::after { content: ""; position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px;
                     border: 2px solid rgba(255,255,255,.6); border-radius: 50%; }
    .nuqta { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 84px; z-index: 1; }
    .nuqta .doira { width: 38px; height: 38px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center;
                    justify-content: center; font-weight: 900; font-size: 15px; background: #ffd54f; color: #3e2723;
                    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
    .nuqta .doira.bosh { background: rgba(255,255,255,.2); color: #fff; border-style: dashed; }
    .nuqta small { display: block; font-size: 11px; margin-top: 2px; text-shadow: 0 1px 2px #000; }

    /* мавсум */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.15); }
    td:first-child, th:first-child { text-align: left; }
    .galaba { color: #69f0ae; font-weight: bold; } .durang { color: #ffd54f; font-weight: bold; } .maglub { color: #ff8a80; font-weight: bold; }
    .sharh-quti { background: rgba(0,0,0,.35); border-radius: 12px; padding: 10px; min-height: 120px; max-height: 260px;
             overflow-y: auto; font-size: 14px; line-height: 1.6; }
    .hisob { font-size: 34px; font-weight: 900; text-align: center; margin: 6px 0; }
    .kubok { text-align: center; font-size: 22px; padding: 10px; }
    .yashirin { display: none !important; }
    /* бўлимлар (таблар) */
    .menyu { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
    .menyu button { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.3); }
    .menyu button.faol { background: #ffd54f; color: #3e2723; border-color: #ffd54f; }
    .olmos { color: #80deea; }
    .vazifa { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: rgba(0,0,0,.25);
              border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
    .vazifa .chiziqcha { height: 8px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; margin-top: 5px; }
    .vazifa .chiziqcha div { height: 100%; background: #69f0ae; }
    .savol { font-size: 18px; font-weight: bold; margin: 8px 0 12px; }
    .javoblar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .javoblar button { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.35); font-weight: normal; }
    .javoblar button.togri { background: #2e7d32; border-color: #69f0ae; }
    .javoblar button.notogri { background: #c62828; border-color: #ff8a80; }
    .mahsulot { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,.25);
                border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
    #xabar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #263238; color: #fff;
             padding: 10px 16px; border-radius: 10px; display: none; z-index: 9; max-width: 90%; text-align: center; }
    footer { text-align: center; color: #a5d6a7; font-size: 13px; margin-top: 16px; }
    .tillar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
    .tillar button { font-size: 13px; padding: 5px 10px; background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.3); }
    .tillar button.faol { background: #ffd54f; color: #3e2723; border-color: #ffd54f; }
  </style>
</head>

        <div id="sharh" class="sharh-quti"></div>

          <button id="oyna-tugma" data-t="keyingiOyin"></button>

        </p>
        <div class="kubok" id="kubok"></div>
      </div>
    </div>
    </div><!-- /b-menejer -->

    <!-- ===== ДРАФТ ===== -->
    <div id="b-draft" class="yashirin">
      <div class="karta">
        <h2 data-t="draftH"></h2>
        <p data-t="draftIzoh"></p>
        <p data-t="draftNarx"></p>
        <button id="draft-boshla" data-t="draftBoshla"></button>

          <div class="royxat" id="draft-variantlar"></div>
        </div>
      </div>
      <div class="karta">
        <h2><span data-t="draftJamoaH"></span> <span id="draft-kuch"></span></h2>
        <div class="maydon" id="draft-maydon"></div>
      </div>
      <div class="karta yashirin" id="draft-mavsum">
        <h2 data-t="draftOyinH"></h2>
        <table id="draft-jadval"></table>
        <div class="hisob" id="draft-hisob"></div>
        <div id="draft-sharh" class="sharh-quti"></div>
        <p style="text-align:center"><button id="draft-oyna" data-t="keyingiOyin"></button></p>
        <div class="kubok" id="draft-kubok"></div>
      </div>
    </div>

        <h2 data-t="vazH"></h2>
        <p style="font-size:13px;color:#c8e6c9" data-t="vazIzoh"></p>
        <div id="vazifa-royxat"></div>
      </div>
    </div>

    <!-- ===== КВЕСТ ===== -->

        <div id="kvest-quti" class="yashirin">

          <div class="savol" id="kvest-savol"></div>
          <div class="javoblar" id="kvest-javoblar"></div>
          <p class="kubok" id="kvest-natija"></p>
          <p style="text-align:center"><button id="kvest-keyingi" class="yashirin"></button></p>
        </div>
      </div>

      </div>
    </div>

    // asl — асл номи (кирилл ва лотинда); maxsus — ўйинчи ўзи ёзган ном (бўлмаса — "")
    const raqiblar = [
      { asl: ["🇳🇱 Аякс", "🇳🇱 Ajax"], kuch: 82, maxsus: "" },
      { asl: ["🇵🇹 Порту", "🇵🇹 Porto"], kuch: 85, maxsus: "" },
      { asl: ["🇩🇪 Боруссия Дортмунд", "🇩🇪 Borussia Dortmund"], kuch: 88, maxsus: "" },
      { asl: ["🇪🇸 Барселона", "🇪🇸 Barcelona"], kuch: 90, maxsus: "" },
      { asl: ["🇩🇪 Бавария", "🇩🇪 Bayern"], kuch: 92, maxsus: "" }
    ];
    const rNomi = (r) => r.maxsus || r.asl[til === "en" ? 1 : 0];
    let klubNomi = "";     // ўз клубингнинг номи (ёзилиши шарт)

    // ===== 3) ҲОЛАТ (localStorage'да сақланади) =====
    let jamoa = [];          // сотиб олинган ўйинчилар (исмлари)
    let natijalar = [];      // мавсумдаги ўйинлар: {men, raqib}
    let mavsumBoshlandi = false;
    let tanlanganPoz = "Д";
    let olmos = 2000;        // 💎 бошланғич олмос
    let qoshimchaPul = 0;    // дўкондан сотиб олинган пул
    let kunlik = {};         // бугунги вазифалар ҳолати
    let draft = { faol: false, jamoa: [], natijalar: [] };
    try {
      const s = JSON.parse(localStorage.getItem("menejer") || "{}");
      jamoa = s.jamoa || []; natijalar = s.natijalar || []; mavsumBoshlandi = !!s.mavsumBoshlandi;
      if (typeof s.olmos === "number") olmos = s.olmos;
      qoshimchaPul = s.qoshimchaPul || 0;
      kunlik = s.kunlik || {};
      draft = s.draft || draft;
      klubNomi = s.klubNomi || "";
      // эски сақланган номлар асл номга тенг бўлса — «махсус» эмас, тилга қараб алмашаверади
      (s.raqibNomlari || []).forEach((n, i) => { if (n && raqiblar[i] && !raqiblar[i].asl.includes(n)) raqiblar[i].maxsus = n; });
    } catch (e) {}
    function saqla() {
      try { localStorage.setItem("menejer", JSON.stringify({ jamoa, natijalar, mavsumBoshlandi, olmos, qoshimchaPul, kunlik, draft,
        klubNomi, raqibNomlari: raqiblar.map((r) => r.maxsus) })); } catch (e) {}
    }
    function xabar(m) {
      const x = document.getElementById("xabar"); x.innerHTML = m; x.style.display = "block";
      clearTimeout(xabar.t); xabar.t = setTimeout(() => { x.style.display = "none"; }, 3000);
    }
    function olmosQosh(n) { olmos += n; saqla(); chizish(); xabar(t("olmosPlus", n)); }

    const $ = (id) => document.getElementById(id);
    const topish = (ism) => oyinchilar.find((o) => o.ism === ism);
    const jamoadagilar = () => jamoa.map(topish).filter(Boolean);
    const sarflangan = () => jamoadagilar().reduce((s, o) => s + o.narx, 0);
    const pozdagilar = (poz) => jamoadagilar().filter((o) => o.poz === poz);
    function jamoaKuchi() {
      if (!jamoa.length) return 0;
      return Math.round(jamoadagilar().reduce((s, o) => s + o.kuch, 0) / jamoa.length);
    }

    // ===== 4) СОТИБ ОЛИШ / СОТИШ =====
    function bosildi(ism) {
      if (mavsumBoshlandi) { alert(t("transferYopiq")); return; }
      const o = topish(ism);
      if (jamoa.includes(ism)) {                         // сотамиз
        jamoa = jamoa.filter((x) => x !== ism);
      } else {                                           // сотиб оламиз
        if (pozdagilar(o.poz).length >= kerak[o.poz]) { alert(t("joyQolmadi", pozNomi(o.poz), kerak[o.poz])); return; }
        if (sarflangan() + o.narx > budjet()) { alert(t("pulYetmaydi")); return; }
        jamoa.push(ism);
      }
      saqla(); chizish();
    }

    // ===== 5) ЭКРАНГА ЧИЗИШ =====
    function chizish() {
      // ҳолат
      $("pul").textContent = budjet() - sarflangan();
      $("olmos").textContent = olmos;
      $("soni").textContent = jamoa.length + "/11";
      $("kuch").textContent = jamoa.length ? jamoaKuchi() : "—";

      // позиция тугмалари
      $("tablar").innerHTML = "";
      Object.keys(kerak).forEach((poz) => {
        const b = document.createElement("button");
        b.textContent = pozNomi(poz) + " (" + pozdagilar(poz).length + "/" + kerak[poz] + ")";
        if (poz === tanlanganPoz) b.className = "faol";
        b.onclick = () => { tanlanganPoz = poz; chizish(); };
        $("tablar").appendChild(b);
      });

      // ўйинчилар рўйхати
      $("royxat").innerHTML = "";
      oyinchilar.filter((o) => o.poz === tanlanganPoz).forEach((o) => {
        const d = document.createElement("div");
        d.className = "oyinchi" + (jamoa.includes(o.ism) ? " olingan" : "");
        d.innerHTML = '<span class="reyting">' + o.kuch + '</span> <span class="poz">' + L[til].qisqa[o.poz] + '</span>' +
                      '<div class="ism">' + nomi(o) + '</div>' +
                      '<div class="narx">💰 ' + o.narx + ' ' + t("mln") + ' ' + (jamoa.includes(o.ism) ? "✅" : "") + '</div>';
        d.onclick = () => bosildi(o.ism);
        $("royxat").appendChild(d);
      });

      maydonChiz("maydon", jamoadagilar());

      // мавсум тугмаси
      $("boshla-tugma").disabled = jamoa.length !== 11 || mavsumBoshlandi;
      $("boshla-tugma").classList.toggle("yashirin", mavsumBoshlandi);
      $("mavsum").classList.toggle("yashirin", !mavsumBoshlandi);
      $("mavsum-matn").textContent = mavsumBoshlandi ? t("mavsumKetyapti")
        : (jamoa.length === 11 ? t("jamoaTayyor") : t("avvalYig"));
      if (mavsumBoshlandi) jadvalChiz();
    }

    // майдонга ўйинчиларни жойлаш (асосий жамоа ҳам, драфт ҳам шуни ишлатади)
    function maydonChiz(joyId, royxat) {
      const joylar = {
        "Ҳу": [[20, 16], [50, 12], [80, 16]],
        "Я": [[25, 40], [50, 46], [75, 40]],
        "Ҳ": [[12, 68], [37, 72], [63, 72], [88, 68]],
        "Д": [[50, 90]]
      };
      const joy = $(joyId); joy.innerHTML = "";
      Object.keys(joylar).forEach((poz) => {
        const bor = royxat.filter((o) => o.poz === poz);
        joylar[poz].forEach(([x, y], i) => {
          const o = bor[i];
          const n = document.createElement("div");
          n.className = "nuqta"; n.style.left = x + "%"; n.style.top = y + "%";
          n.innerHTML = o ? '<div class="doira">' + o.kuch + '</div><small>' + nomi(o).split(" ").slice(-1)[0] + '</small>'
                          : '<div class="doira bosh">' + L[til].qisqa[poz] + '</div><small>' + t("bosh") + '</small>';
          joy.appendChild(n);
        });
      });
    }

    // ===== 6) МАВСУМ =====
    // клуб номи ёзилмаган бўлса — ўйин бошланмайди
    function klubBormi() {
      if (klubNomi) return true;
      xabar(t("klubYoz"));
      $("klub-nomi").focus(); $("klub-nomi").scrollIntoView({ behavior: "smooth", block: "center" });
      return false;
    }
    $("boshla-tugma").onclick = () => {
      if (!klubBormi()) return;
      mavsumBoshlandi = true; natijalar = [];
      $("sharh").innerHTML = ""; $("hisob").textContent = ""; $("kubok").textContent = "";
      saqla(); chizish();
    };

    function sinf(n) { return n.men > n.raqib ? "galaba" : (n.men === n.raqib ? "durang" : "maglub"); }
    function jadvalChiz() {
      let h = "<tr><th>" + t("raqib") + "</th><th>" + t("kuchi") + "</th><th>" + t("natija") + "</th></tr>";
      raqiblar.forEach((r, i) => {
        const n = natijalar[i];
        const natija = n ? '<span class="' + sinf(n) + '">' + n.men + " : " + n.raqib + "</span>" : "—";
        h += "<tr><td>" + rNomi(r) + "</td><td>" + r.kuch + "</td><td>" + natija + "</td></tr>";
      });
      const ochko = natijalar.reduce((s, n) => s + (n.men > n.raqib ? 3 : n.men === n.raqib ? 1 : 0), 0);
      h += "<tr><td><b>" + t("ochko") + "</b></td><td></td><td><b>" + ochko + " / " + raqiblar.length * 3 + "</b></td></tr>";
      $("jadval").innerHTML = h;
      const tugadi = natijalar.length >= raqiblar.length;
      $("oyna-tugma").classList.toggle("yashirin", tugadi);
      $("qayta-tugma").classList.toggle("yashirin", !tugadi);
      $("kubok").innerHTML = tugadi ? kubokMatni(ochko) : "";
    }

    function kubokMatni(ochko) {
      if (ochko >= 13) return t("chempion");
      if (ochko >= 9) return t("yaxshi");
      return t("ogir");
    }

    // Пуассон тақсимоти — футболда голлар сонини табиий қилади
    function golSoni(ortacha) {
      let P = Math.exp(-ortacha), k = 0, p = 1;
      do { k++; p *= Math.random(); } while (p > P);
      return k - 1;
    }

    // голни ким урди? — ҳужумчиларга кўпроқ имконият
    function golUrdi(royxatJamoa) {
      const vazn = { "Ҳу": 5, "Я": 3, "Ҳ": 1, "Д": 0 };
      const royxat = [];
      (royxatJamoa || jamoadagilar()).forEach((o) => { for (let i = 0; i < vazn[o.poz]; i++) royxat.push(o); });
      return nomi(royxat[Math.floor(Math.random() * royxat.length)]);
    }
    const yakun = (men, raqib) => (men > raqib ? t("galaba") : men === raqib ? t("durang") : t("maglub"));

    $("oyna-tugma").onclick = () => {
      const i = natijalar.length;
      const r = raqiblar[i];
      const farq = jamoaKuchi() - r.kuch;                         // кучлар фарқи
      const menOrtacha = Math.max(0.3, Math.min(4, 1.4 + farq * 0.12));
      const raqibOrtacha = Math.max(0.2, Math.min(4, 1.2 - farq * 0.12));
      const men = golSoni(menOrtacha), raqib = golSoni(raqibOrtacha);

      // голлар дақиқалари
      const voqealar = [];
      for (let g = 0; g < men; g++) voqealar.push({ daq: 1 + Math.floor(Math.random() * 90), biz: true, kim: golUrdi() });
      for (let g = 0; g < raqib; g++) voqealar.push({ daq: 1 + Math.floor(Math.random() * 90), biz: false });
      voqealar.sort((a, b) => a.daq - b.daq);

      // жонли шарҳ: ҳар бир воқеа 0.8 сониядан кейин чиқади
      $("oyna-tugma").disabled = true;
      $("sharh").innerHTML = t("oyinBoshlandi", klubNomi, rNomi(r)) + "<br>";
      let a = 0, b = 0;
      $("hisob").textContent = "0 : 0";
      voqealar.forEach((v, k) => {
        setTimeout(() => {
          if (v.biz) { a++; $("sharh").innerHTML += t("gol", v.daq, v.kim) + "<br>"; }
          else { b++; $("sharh").innerHTML += t("raqibGol", v.daq, rNomi(r)) + "<br>"; }
          $("hisob").textContent = a + " : " + b;
          $("sharh").scrollTop = 99999;
        }, 800 * (k + 1));
      });
      setTimeout(() => {
        $("sharh").innerHTML += t("tugadi") + " " + yakun(men, raqib) + "<br>";
        $("sharh").scrollTop = 99999;
        natijalar.push({ men, raqib });
        kunlikYoz(men, raqib);
        saqla(); jadvalChiz(); chizish();
        $("oyna-tugma").disabled = false;
      }, 800 * (voqealar.length + 1));
    };

    $("qayta-tugma").onclick = () => {
      mavsumBoshlandi = false; natijalar = [];
      $("sharh").innerHTML = ""; $("hisob").textContent = ""; $("kubok").textContent = "";
      saqla(); chizish();
    };

    // ===================== 7) МЕНЮ (бўлимлар) =====================
    document.querySelectorAll("#menyu button").forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll("#menyu button").forEach((x) => x.classList.toggle("faol", x === b));
        ["menejer", "draft", "vazifalar", "kvest", "dokon"].forEach((n) =>
          $("b-" + n).classList.toggle("yashirin", n !== b.dataset.b));
        if (b.dataset.b === "vazifalar") vazifalarChiz();
        if (b.dataset.b === "draft") draftChiz();
      };
    });

    // ===================== 8) КУНЛИК ВАЗИФАЛАР =====================
    function bugun() {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    }
    // кун алмашса — вазифалар янгиланади
    function kunlikTekshir() {
      if (kunlik.sana !== bugun()) {
        kunlik = { sana: bugun(), galaba: 0, gol: 0, kvest: 0, olindi: [false, false, false] };
        saqla();
      }
    }
    const vazifalar = [
      { kalit: "galaba", kerak: 2, sovga: 500 },
      { kalit: "gol", kerak: 5, sovga: 500 },
      { kalit: "kvest", kerak: 1, sovga: 1000 }
    ];
    function kunlikYoz(men, raqib) {
      kunlikTekshir();
      kunlik.gol += men;
      if (men > raqib) kunlik.galaba++;
      saqla();
    }
    function vazifalarChiz() {
      kunlikTekshir();
      const joy = $("vazifa-royxat"); joy.innerHTML = "";
      vazifalar.forEach((v, i) => {
        const bor = Math.min(kunlik[v.kalit], v.kerak);
        const quti = document.createElement("div");
        quti.className = "vazifa";
        quti.innerHTML = '<div style="flex:1"><b>' + L[til].vaz[i] + '</b> — ' + bor + "/" + v.kerak +
          '<div class="chiziqcha"><div style="width:' + (bor / v.kerak * 100) + '%"></div></div></div>';
        const tg = document.createElement("button");
        if (kunlik.olindi[i]) { tg.textContent = t("olindi"); tg.disabled = true; }
        else { tg.textContent = "+" + v.sovga + " 💎"; tg.disabled = bor < v.kerak; }
        tg.onclick = () => { kunlik.olindi[i] = true; olmosQosh(v.sovga); vazifalarChiz(); };
        quti.appendChild(tg);
        joy.appendChild(quti);
      });
    }

    });

    // ===================== 11) ДРАФТ =====================
    const tartib = ["Д", "Ҳ", "Ҳ", "Ҳ", "Ҳ", "Я", "Я", "Я", "Ҳу", "Ҳу", "Ҳу"];   // қайси жой қачон танланади
    let draftVariantlar = [];
    const draftJamoa = () => draft.jamoa.map(topish).filter(Boolean);
    const draftKuchi = () => draft.jamoa.length ? Math.round(draftJamoa().reduce((s, o) => s + o.kuch, 0) / draft.jamoa.length) : 0;

    $("draft-boshla").onclick = () => {
      if (!klubBormi()) return;
      if (draft.faol && draft.jamoa.length < 11) { xabar(t("draftDavom")); return; }
      if (olmos < 1000) { xabar(t("draftOlmos")); return; }
      olmos -= 1000;
      draft = { faol: true, jamoa: [], natijalar: [] };
      draftVariantlar = [];
      saqla(); chizish(); draftChiz();
    };
    function draftChiz() {
      maydonChiz("draft-maydon", draftJamoa());
      $("draft-kuch").textContent = draft.jamoa.length ? "· 💪 " + draftKuchi() : "";
      const tanlash = draft.faol && draft.jamoa.length < 11;
      $("draft-tanlov").classList.toggle("yashirin", !tanlash);
      $("draft-boshla").classList.toggle("yashirin", draft.faol && draft.natijalar.length < raqiblar.length);
      $("draft-mavsum").classList.toggle("yashirin", !(draft.faol && draft.jamoa.length === 11) && !draft.natijalar.length);
      if (tanlash) {
        const poz = tartib[draft.jamoa.length];
        if (!draftVariantlar.length) {
          // шу позициядаги, ҳали олинмаган ўйинчилардан 3 та тасодифийси
          draftVariantlar = aralash(oyinchilar.filter((o) => o.poz === poz && !draft.jamoa.includes(o.ism))).slice(0, 3).map((o) => o.ism);
        }
        $("draft-sarlavha").textContent = t("tanla", pozNomi(poz), draft.jamoa.length + 1);
        $("draft-variantlar").innerHTML = "";
        draftVariantlar.map(topish).forEach((o) => {
          const d = document.createElement("div");
          d.className = "oyinchi";
          d.innerHTML = '<span class="reyting">' + o.kuch + '</span> <span class="poz">' + L[til].qisqa[o.poz] + '</span><div class="ism">' + nomi(o) + '</div><div class="narx">' + t("tanlash") + '</div>';
          d.onclick = () => { draft.jamoa.push(o.ism); draftVariantlar = []; saqla(); draftChiz(); };
          $("draft-variantlar").appendChild(d);
        });
      }
      draftJadval();
    }
    function draftJadval() {
      let h = "<tr><th>" + t("raqib") + "</th><th>" + t("kuchi") + "</th><th>" + t("natija") + "</th></tr>";
      raqiblar.forEach((r, i) => {
        const n = draft.natijalar[i];
        const nat = n ? '<span class="' + sinf(n) + '">' + n.men + " : " + n.raqib + "</span>" : "—";
        h += "<tr><td>" + rNomi(r) + "</td><td>" + r.kuch + "</td><td>" + nat + "</td></tr>";
      });
      $("draft-jadval").innerHTML = h;
      const tugadi = draft.natijalar.length >= raqiblar.length;
      $("draft-oyna").classList.toggle("yashirin", tugadi || draft.jamoa.length < 11);
      if (tugadi) {
        const g = draft.natijalar.filter((n) => n.men > n.raqib).length;
        $("draft-kubok").innerHTML = t("draftTugadi", g, g * 500);
      } else $("draft-kubok").textContent = "";
    }
    $("draft-oyna").onclick = () => {
      const r = raqiblar[draft.natijalar.length];
      const farq = draftKuchi() - r.kuch;
      const men = golSoni(Math.max(0.3, Math.min(4, 1.4 + farq * 0.12)));
      const raqib = golSoni(Math.max(0.2, Math.min(4, 1.2 - farq * 0.12)));
      const voqealar = [];
      for (let g = 0; g < men; g++) voqealar.push({ daq: 1 + Math.floor(Math.random() * 90), biz: true, kim: golUrdi(draftJamoa()) });
      for (let g = 0; g < raqib; g++) voqealar.push({ daq: 1 + Math.floor(Math.random() * 90), biz: false });
      voqealar.sort((a, b) => a.daq - b.daq);
      $("draft-oyna").disabled = true;
      $("draft-sharh").innerHTML = t("draftOyini", klubNomi, rNomi(r)) + "<br>";
      $("draft-hisob").textContent = "0 : 0";
      let a = 0, b = 0;
      voqealar.forEach((v, k) => setTimeout(() => {
        if (v.biz) { a++; $("draft-sharh").innerHTML += t("golQisqa", v.daq, v.kim) + "<br>"; }
        else { b++; $("draft-sharh").innerHTML += t("raqibGol", v.daq, rNomi(r)) + "<br>"; }
        $("draft-hisob").textContent = a + " : " + b;
      }, 800 * (k + 1)));
      setTimeout(() => {
        draft.natijalar.push({ men, raqib });
        kunlikYoz(men, raqib);
        $("draft-sharh").innerHTML += "🏁 " + yakun(men, raqib) + (men > raqib ? " +500 💎" : "") + "<br>";
        $("draft-oyna").disabled = false;
        if (men > raqib) olmosQosh(500); else { saqla(); chizish(); }
        draftChiz();
      }, 800 * (voqealar.length + 1));
    };

    // ===================== 12) КЛУБ НОМЛАРИ =====================
    function klubFormaChiz() {
      $("klub-nomi").value = klubNomi;
      $("raqib-nomlari").innerHTML = "";
      raqiblar.forEach((r, i) => {
        const q = document.createElement("div");
        q.style.cssText = "display:flex;gap:6px;align-items:center;margin:4px 0";
        q.innerHTML = '<span style="min-width:110px">' + t("raqibN", i + 1, r.kuch) + '</span>';
        const inp = document.createElement("input");
        inp.type = "text"; inp.maxLength = 30; inp.value = rNomi(r); inp.dataset.i = i;
        inp.style.cssText = "flex:1;font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid #ccc";
        q.appendChild(inp);
        $("raqib-nomlari").appendChild(q);
      });
    }
    $("klub-saqla").onclick = () => {
      const nom = $("klub-nomi").value.trim();
      if (!nom) { xabar(t("klubShart")); $("klub-nomi").focus(); return; }
      klubNomi = nom;
      document.querySelectorAll("#raqib-nomlari input").forEach((inp) => {
        const v = inp.value.trim();
        const r = raqiblar[inp.dataset.i];
        if (!v || r.asl.includes(v)) r.maxsus = "";   // бўш ёки асл номи — тилга қараб ўзгараверади
        else r.maxsus = v;                            // ўзи ёзган ном — ҳамма тилда шундай қолади
      });
      saqla(); chizish(); draftChiz(); klubFormaChiz();
      xabar(t("saqlandi", klubNomi));
    };

    // ===================== 13) ТИЛНИ АЛМАШТИРИШ =====================
    // data-t="калит" бор ҳамма элементга шу тилдаги матнни ёзамиз, кейин ҳамма бўлимни қайта чизамиз
    function tilQoy(yangi) {
      til = yangi;
      try { localStorage.setItem("menejer_til", til); } catch (e) {}
      document.documentElement.lang = til;
      document.title = t("title");
      document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = t(el.dataset.t); });
      document.querySelectorAll("[data-tp]").forEach((el) => { el.placeholder = t(el.dataset.tp); });
      document.querySelectorAll("#tillar button").forEach((b) => b.classList.toggle("faol", b.dataset.til === til));
      klubFormaChiz(); chizish(); draftChiz(); vazifalarChiz();
      kvestTugmaChiz(); savolKorsat(); kvestNatijaChiz();
    }
    document.querySelectorAll("#tillar button").forEach((b) => { b.onclick = () => tilQoy(b.dataset.til); });

    kunlikTekshir();
    tilQoy(til);
  </script>
</body>
</html>
